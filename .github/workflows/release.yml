name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        run: node scripts/verify-version.mjs "${{ inputs.tag || github.ref_name }}"
      - run: npm run release:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
      - run: npm run release:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: openearth-release-${{ inputs.tag || github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* --verify-tag --generate-notes --title "OpenEarth XR $TAG"
          fi
