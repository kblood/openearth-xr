# OpenEarth releases are uploaded below this directory and activated through
# the /var/www/html/openearth symlink. Keep overrides scoped to OpenEarth's
# logical and immutable paths instead of enabling them for all of /var/www.
<Directory "/var/www/html/openearth">
  Options -Indexes
  AllowOverride FileInfo
</Directory>

<Directory "/var/www/html/.openearth-releases">
  Options -Indexes
  AllowOverride FileInfo
</Directory>
